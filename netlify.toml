# netlify.toml — configuration Netlify (déploiement par glisser-déposer)

# Emplacement des fonctions serverless (newsletter + médiathèque Airtable)
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Anciens liens vers /Liberte Cherie.html → redirigés vers l'accueil
[[redirects]]
  from = "/Liberte%20Cherie.html"
  to = "/"
  status = 301

[[redirects]]
  from = "/Liberte Cherie.html"
  to = "/"
  status = 301

# Joli alias : POST /api/subscribe → fonction subscribe (newsletter)
[[redirects]]
  from = "/api/subscribe"
  to = "/.netlify/functions/subscribe"
  status = 200

# Joli alias : GET /api/mediatheque → fonction mediatheque (lecture Airtable)
[[redirects]]
  from = "/api/mediatheque"
  to = "/.netlify/functions/mediatheque"
  status = 200
# Joli alias : GET /api/evenements → fonction evenements (billetterie)
[[redirects]]
  from = "/api/evenements"
  to = "/.netlify/functions/evenements"
  status = 200

# Ancienne page d'accès : la toolbox s'ouvre désormais directement en aperçu
[[redirects]]
  from = "/lettres-acces"
  to = "/lettres/toolbox-argent"
  status = 301

# ---------- Cache et sécurité ----------
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/assets/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/img/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/lettres/img/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/assets/*.css"
  [headers.values]
    Cache-Control = "public, max-age=86400, must-revalidate"

[[headers]]
  for = "/assets/*.js"
  [headers.values]
    Cache-Control = "public, max-age=86400, must-revalidate"

[[headers]]
  for = "/llms.txt"
  [headers.values]
    Content-Type = "text/markdown; charset=utf-8"
